# Ruff aligned with VaultTrackerAPI (`VaultTrackerAPI/pyproject.toml`).
# Install Ruff with the same range as API CI: `pip install 'ruff>=0.8,<1'`.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vaulttracker-scanner"
version = "0.1.0"
description = "Local tools to parse broker/CSV exports and import into VaultTracker via the smart transaction API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8,<1"]

[project.scripts]
vaulttracker-scan = "vaulttracker_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
